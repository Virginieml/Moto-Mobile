<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kigali E-Moto Battery Check</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="icon">🛵</div>
    <h1>E-Moto Battery Check</h1>
    <p class="subtitle">Kigali Electric Motorcycle Network</p>

    <label for="bikeId">Bike ID</label>
    <input type="text" id="bikeId" placeholder="Enter Bike ID (e.g., KB-104)" autocomplete="off" autocapitalize="characters">

    <button id="checkBtn">Check Battery</button>

    <div id="result"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
